<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study MBBS Abroad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6pNK7rhD/fly.png">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=YOUR-GA-ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CSH16S76K7');
    </script>

    <!-- Facebook Pixel -->
    <script>
      !function(f,b,e,v,n,t,s) {
        if(f.fbq) return; n=f.fbq=function(){n.callMethod? n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq) f._fbq=n; n.push=n; n.loaded=!0; n.version='2.0';
        n.queue=[]; t=b.createElement(e); t.async=!0;
        t.src=v; s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s);
      }(window,document,'script', 'https://connect.facebook.net/en_US/fbevents.js'); 
      fbq('init', 'YOUR-FB-PIXEL-ID'); 
      fbq('track', 'PageView');
    </script>
</head>
<body class="font-sans bg-gray-100">

    <!-- Hero Section -->
    <section class="relative bg-cover bg-center h-screen flex flex-col items-center justify-center text-white text-center"
        style="background-image: url('https://i.postimg.cc/fTwBqk56/pexels-digitle-pixels-1775950082-30630149.jpg');">
        
        <!-- Dark overlay -->
        <div class="absolute inset-0 bg-black bg-opacity-70"></div>

        <!-- Content -->
        <div class="relative z-10">
            
            <h2 class="text-3xl font-semibold text-blue-300">Why Study MBBS Abroad?</h2>
        <p class="mt-3">Affordable tuition, global exposure, and world-class education.</p>
            <div class="mt-5">
                <h1 class="text-4xl font-bold">Apply Now for MBBS Abroad</h1>
            <p class="text-lg mt-2">Start your journey to becoming a doctor today!</p>
                <button id="applyNowBtn" class="mt-4 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Apply Now</button>
            </div>
        </div>
    </section>
    <!-- Call-to-Action (Lead Form) -->
    <section id="lead-form" class="py-10 bg-blue-50 text-center hidden">
        <h2 class="text-3xl font-semibold">Top Countries</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-7 gap-6 mt-6 px-10">
            <div class="p-4 bg-white rounded-lg">🇷🇺 Russia</div>
            <div class="p-4 bg-white rounded-lg">🇺🇿 Uzbekistan</div>
            <div class="p-4 bg-white rounded-lg">🇰🇿 Kazakhstan</div>
            <div class="p-4 bg-white rounded-lg">🇵🇭 Philippines</div>
            <div class="p-4 bg-white rounded-lg">🇬🇪 Georgia</div>
            <div class="p-4 bg-white rounded-lg">🇰🇬 Kyrgyzstan</div>
            <div class="p-4 bg-white rounded-lg">🇪🇬 Egypt</div>
        </div>
        <h2 class="text-3xl font-semibold mt-5">Apply Now</h2>
        <form class="max-w-md mx-auto mt-6 bg-white p-6 rounded-lg shadow-md">
            <input type="text" id="name" class="w-full p-2 border rounded mb-3" placeholder="Full Name" required>
            <input type="email" id="email" class="w-full p-2 border rounded mb-3" placeholder="Email" required>
            <input type="tel" id="phone" class="w-full p-2 border rounded mb-3" placeholder="Phone" required>
            <select id="country" class="w-full p-2 border rounded mb-3">
                <option>Select Preferred Country</option>
                <option>Russia</option>
                <option>Uzbekistan</option>
                <option>Kazakhstan</option>
                <option>Philippines</option>
                <option>Georgia</option>
                <option>Kyrgyzstan</option>
                <option>Egypt</option>
            </select>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Submit</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
